minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.149'
  - '@ai-sdk/google@4.0.122'
  - '@ai-sdk/mcp@2.0.101'
  - '@ai-sdk/provider-utils@5.0.82'
  - '@ai-sdk/provider@4.0.39'
  - '@ai-sdk/react@4.0.180'
  - ai@7.0.176

# Dependency install scripts stay off: Prisma 7 generates its client (postinstall: prisma generate)
# without downloading engines, and core-js's script only prints a banner.
allowBuilds:
  '@prisma/engines': false
  core-js: false
  prisma: false
